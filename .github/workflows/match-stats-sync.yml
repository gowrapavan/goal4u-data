name: Match Stats Sync

on:
  schedule:
    - cron: "0 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: match-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest

    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          pip install -r requirements.txt

      - run: |
          playwright install chromium

      - name: Scrape missing stats
        env:
          WEBSHARE_PROXY_URL: ${{ secrets.WEBSHARE_PROXY_URL }}
        run: |
          python main.py \
            --only match_stats \
            --workers 8 \
            --checkpoint 25

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add data
          git diff --cached --quiet || git commit -m "match stats sync"
          git push