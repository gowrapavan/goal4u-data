name: "Standings & Scorers — Daily Sync"

# Runs every day at 03:00 UTC
# Re-fetches full standings tables and top scorers for all 8 competitions.
# Single API call per competition per mode — cheap and fast (16 calls total).
#
# Was previously weekly, but league tables and scorer rankings change after
# every matchday (sometimes multiple times a week per competition), so a
# 7-day-stale table defeated the point of tracking standings at all. The live
# and recent match audits already patch standings opportunistically right
# after a match updates — this daily run is the guaranteed catch-all so
# nothing drifts for more than a day even if an audit run is missed.

on:
  schedule:
    - cron: "0 3 * * *"   # Daily 03:00 UTC
  workflow_dispatch:

env:
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  PYTHONUNBUFFERED: "1"

jobs:
  sync-standings-scorers:
    name: "Sync standings + scorers (all competitions)"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync standings
        run: python workers/fetch_competitions.py --mode standings

      - name: Sync scorers
        run: python workers/fetch_competitions.py --mode scorers

      - name: Commit updated standings + scorers
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore(data): daily standings + scorers sync [skip ci]"

          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Pushed successfully on attempt $i."
                exit 0
              fi
            else
              echo "Rebase conflict on attempt $i — aborting rebase and retrying."
              git rebase --abort || true
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "::error::Failed to push after 5 attempts — check for a real conflict."
          exit 1
