name: "Standings & Scorers — Daily Sync (Current Season)"

# Runs every day at 03:00 UTC.
# Re-fetches full standings tables and top scorers for all active competitions.
#
# SCOPE: current active season only.
# fetch_competitions.py (no --season flag) resolves the season automatically.
#
# WC / EC note: the API returns 404 for standings/scorers on cup competitions
# that are between tournaments (e.g. WC when no tournament is active in this
# season range). fetch_competitions.py handles this gracefully via Conditional
# Fallback — it logs a warning and preserves the existing file unchanged.
# No special casing needed here.
#
# The live and recent match audits also refresh standings opportunistically
# right after a match updates — this daily run is the guaranteed catch-all.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  PYTHONUNBUFFERED: "1"

jobs:
  sync-standings-scorers:
    name: "Sync standings + scorers (current season)"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync standings
        run: python workers/fetch_competitions.py --mode standings

      - name: Sync scorers
        run: python workers/fetch_competitions.py --mode scorers

      - name: Commit updated standings + scorers
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore(data): daily standings + scorers sync [skip ci]"

          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Pushed successfully on attempt $i."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "::error::Failed to push after 5 attempts."
          exit 1
