name: "Competition Metadata — Monthly Sync (Current Season)"

# Runs on the 1st of every month at 05:00 UTC.
# Re-fetches bare competition metadata (name, code, emblem, area/flag,
# currentSeason dates) for all tracked competitions.
#
# SCOPE: current active season only.
# The /competitions/{code} endpoint has no ?season= variant on the API —
# it always returns the current season's metadata. fetch_competitions.py
# (--mode competitions) handles this correctly.
#
# This data almost never changes (emblem/area/name is static year-round),
# so monthly is more than enough. It only needs refreshing when a new
# season's currentSeason.startDate/endDate rolls over.

on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

env:
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  PYTHONUNBUFFERED: "1"

jobs:
  sync-competitions:
    name: "Sync competition metadata (current season)"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync competition metadata
        run: python workers/fetch_competitions.py --mode competitions

      - name: Commit updated competition metadata
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore(data): monthly competition metadata sync [skip ci]"

          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Pushed successfully on attempt $i."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "::error::Failed to push after 5 attempts."
          exit 1
