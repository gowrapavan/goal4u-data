name: "Competition Metadata — Monthly Sync"

# Runs on the 1st of every month at 05:00 UTC
# Re-fetches bare competition metadata only (name, code, emblem, area/flag,
# currentSeason dates) for all 8 competitions — GET /competitions/{code}.
#
# This is split out from the daily standings/scorers job on purpose: this
# data almost never changes (a competition's name/emblem/area is static
# year-round), so refreshing it daily would just be wasted API calls. It only
# really needs a refresh when a new season's currentSeason.startDate/endDate
# rolls over — once a month is more than enough margin for that.
#
# NOTE: this endpoint has no historical ?season= variant on the API, so it
# is always "current season" only — there is no --season flag to pass here.

on:
  schedule:
    - cron: "0 5 1 * *"   # 1st of the month, 05:00 UTC
  workflow_dispatch:

env:
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  PYTHONUNBUFFERED: "1"

jobs:
  sync-competitions:
    name: "Sync competition metadata (all competitions)"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync competition metadata
        run: python workers/fetch_competitions.py --mode competitions

      - name: Commit updated competition metadata
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore(data): monthly competition metadata sync [skip ci]"

          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Pushed successfully on attempt $i."
                exit 0
              fi
            else
              echo "Rebase conflict on attempt $i — aborting rebase and retrying."
              git rebase --abort || true
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "::error::Failed to push after 5 attempts — check for a real conflict."
          exit 1
