name: "Historical Backfill — Match Stats (Scrape Loop)"

# MANUAL TRIGGER ONLY — run this on demand to patch historical seasons.
#
# This workflow scans specified historical season folders for finished
# matches that lack match stats on disk, and scrapes up to the limit per run.
#
# Run this workflow repeatedly for given historical seasons until the
# "pending next run" value logged by the scraper drops down to 0.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Comma-separated season start years to backfill (e.g. 2022,2023,2024,2025)"
        required: true
        default: "2024,2025"
      limit:
        description: "Max match stat pages to scrape PER SEASON this run"
        required: true
        default: "50"

env:
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  WEBSHARE_PROXY_URL: ${{ secrets.WEBSHARE_PROXY_URL }}
  PYTHONUNBUFFERED: "1"

jobs:
  backfill-match-stats:
    name: "Backfill stats — season ${{ matrix.season }}"
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        season: ${{ fromJSON(format('[{0}]', github.event.inputs.seasons)) }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright playwright-stealth

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # ── Compute Folder ────────────────────────────────────────────────────────
      - name: Compute season folder string
        id: season_folder
        run: |
          SEASON_END=$(( ${{ matrix.season }} + 1 ))
          echo "folder=${{ matrix.season }}-${SEASON_END}" >> $GITHUB_OUTPUT

      # ── Scrape Stats ──────────────────────────────────────────────────────────
      - name: Audit + backfill missing match stats (season ${{ matrix.season }})
        env:
          SEASON: ${{ steps.season_folder.outputs.folder }}
        run: PYTHONPATH=${{ github.workspace }} xvfb-run --auto-servernum python -m workers.fetch_match_stats --audit --all --limit ${{ github.event.inputs.limit }}

      # ── Commit & push (Robust Merge Strategy) ─────────────────────────────────
      - name: Commit and push season ${{ matrix.season }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -f data/
          
          if git diff --cached --quiet; then
            echo "No changes for season ${{ matrix.season }}"
            exit 0
          fi
          
          git commit -m "chore(data): historical stats backfill season ${{ matrix.season }} [skip ci]"

          # Pull latest remote changes, preferring our newly generated JSON files during any conflicts
          git pull origin main --strategy-option=ours --no-edit

          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed season ${{ matrix.season }} on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed. Fetching and rebasing..."
            git fetch origin main
            git rebase origin/main -X ours || { git rebase --abort; sleep 10; continue; }
          done

          echo "::error::Failed to push backfill for season ${{ matrix.season }} after 5 attempts."
          exit 1