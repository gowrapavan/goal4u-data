name: "Historical Backfill — Data (matches, standings, scorers, teams, match-links)"

# MANUAL TRIGGER ONLY — run-once job per season, not a recurring sync.
#
# Fetches the full data stack for one or more past seasons:
#   1. matches          →  data/{season}/matches/{CODE}.json
#   2. standings        →  data/{season}/standings/{CODE}.json
#   3. scorers          →  data/{season}/scorers/{CODE}.json
#   4. teams / squads   →  data/{season}/teams/{CODE}/{id}.json
#   5. match-links      →  data/{season}/match-links/{CODE}.json  (YallaShoot URL map)
#
# NOTE — what is NOT fetched here:
#   • Competition metadata (/competitions/{code}) has no ?season= variant on the
#     API — it always reflects the current season. Skipped intentionally.
#   • Match stats (yallashoot scrape) are handled separately by
#     historical_backfill_stats.yml so this job stays fast and API-only.
#
# WC / EC behaviour:
#   • The API returns 404 for WC/EC when no tournament ran in that season window
#     (e.g. WC at season=2025 → 404 because WC 2026 is at season=2026).
#   • fetch_matches.py falls back to monthly chunks and still returns 0 matches
#     (empty list, file not written — Conditional Fallback preserves any existing file).
#   • fetch_competitions.py and fetch_teams.py handle 404s identically — skip + warn.
#   • This is correct and expected — no fix needed in the workflows.
#
# Season matrix runs SEQUENTIALLY (max-parallel: 1) to avoid git push races
# on the shared data/ tree. fail-fast: false so one bad season doesn't block the rest.
#
# Usage:
#   Go to Actions → "Historical Backfill — Data" → Run workflow
#   Enter comma-separated season start years, e.g.: 2022,2023,2024,2025
#
# For WC 2026 (which runs in June–July 2026, stored in data/2026-2027/):
#   Enter: 2026   →  fetches data/2026-2027/ with api ?season=2026


on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Comma-separated season start years to backfill (e.g. 2022,2023,2024,2025)"
        required: true
        default: "2024,2025"

jobs:
  backfill-data:
    name: "Backfill data — season ${{ matrix.season }}"
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        season: ${{ fromJSON(format('[{0}]', github.event.inputs.seasons)) }}
    permissions:
      contents: write
    env:
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      WEBSHARE_PROXY_URL: ${{ secrets.WEBSHARE_PROXY_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright playwright-stealth

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # ── Steps 1-4 ─────────────────────────────────────────────────────────────
      - name: Fetch matches (season ${{ matrix.season }})
        run: python workers/fetch_matches.py --season ${{ matrix.season }}

      - name: Fetch standings (season ${{ matrix.season }})
        run: python workers/fetch_competitions.py --mode standings --season ${{ matrix.season }}

      - name: Fetch scorers (season ${{ matrix.season }})
        run: python workers/fetch_competitions.py --mode scorers --season ${{ matrix.season }}

      - name: Fetch teams / squads (season ${{ matrix.season }})
        run: python workers/fetch_teams.py --season ${{ matrix.season }}

      # ── Step 5: Match links ──────────────────────────────────────────────────
      - name: Compute season folder string
        id: season_folder
        run: |
          SEASON_END=$(( ${{ matrix.season }} + 1 ))
          echo "folder=${{ matrix.season }}-${SEASON_END}" >> $GITHUB_OUTPUT

      - name: Fetch match links (season ${{ matrix.season }})
        env:
          SEASON: ${{ steps.season_folder.outputs.folder }}
        run: PYTHONPATH=${{ github.workspace }} xvfb-run --auto-servernum python -m workers.fetch_match_links --all

      # ── Commit & push ────────────────────────────────────────────────────────
      - name: Commit and push season ${{ matrix.season }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/
          if git diff --cached --quiet; then echo "Nothing to commit for season ${{ matrix.season }}"; exit 0; fi
          git commit -m "chore(data): historical backfill data season ${{ matrix.season }} [skip ci]"

          for i in 1 2 3 4 5; do
            git pull origin main --strategy-option=ours --no-edit
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main -X ours || { git rebase --abort; sleep 10; }
          done
          echo "::error::Failed to push backfill for season ${{ matrix.season }} after 5 attempts."
          exit 1