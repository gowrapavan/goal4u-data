name: "Match Links & Stats — Hourly Sync"

on:
  schedule:
    # Runs every hour at minute 0
    - cron: "0 * * * *"

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:

env:
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  WEBSHARE_PROXY_URL: ${{ secrets.WEBSHARE_PROXY_URL }}
  PYTHONUNBUFFERED: "1"

jobs:
  sync-match-stats:
    name: "Sync match links + scrape match stats"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright playwright-stealth

      # 2. Install Chromium browser binary (cached across runs)
      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      # 3. Install Xvfb (virtual display) so headless=False works on Linux CI
      #    This is the key step — CF bot detection checks navigator.webdriver
      #    and several other signals that are only clean in non-headless mode.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # 4. Run your scraping steps WRAPPED in xvfb-run.
      #    PYTHONPATH is set inline so xvfb-run inherits it correctly —
      #    a top-level env: block value isn't reliably forwarded through xvfb-run.
      - name: Sync match links
        run: PYTHONPATH=${{ github.workspace }} xvfb-run --auto-servernum python -m workers.fetch_match_links --all

      - name: Scrape match stats
        run: PYTHONPATH=${{ github.workspace }} xvfb-run --auto-servernum python -m workers.fetch_match_stats --all --week

      # 5. Save the data! Commit and push the newly scraped files back to the repo.
      - name: Commit and Push Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f data/
          git commit -m "chore: automated hourly sync for match links and stats" || echo "No new data to commit"
          git push