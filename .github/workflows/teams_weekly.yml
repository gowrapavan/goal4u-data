name: "Teams — Weekly Sync (Current Season)"

# Runs every Monday at 08:00 UTC.
# Uses GET /competitions/{code}/teams — one call per competition, no per-team 403s.
# Squad/coach data is stable outside transfer windows; weekly cadence is sufficient.
#
# SCOPE: current active season only.
# fetch_teams.py (no --season flag) auto-resolves via config.get_season_paths().
#
# WC / EC note: if WC/EC is not active for this season window the API returns
# 404, which is handled gracefully (Conditional Fallback preserves existing file).
# During an active WC/EC tournament you can trigger this manually after squads
# are announced to pull in the registered squad lists.

on:
  schedule:
    - cron: "0 8 * * 1"   # Monday 08:00 UTC
  workflow_dispatch:

env:
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  PYTHONUNBUFFERED: "1"

jobs:
  sync-teams:
    name: "Sync teams + squads (current season)"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync teams
        run: python workers/fetch_teams.py

      - name: Commit updated team files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore(data): weekly teams sync [skip ci]"

          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Pushed successfully on attempt $i."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "::error::Failed to push after 5 attempts."
          exit 1
