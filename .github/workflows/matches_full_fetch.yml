name: "Matches — Full Fetch"

# Runs once a week (Every Sunday at 04:00 UTC)
# Exhaustively pulls down the entire season match fixture grid across all 8 competitions.
# This acts as a master baseline reset so the incremental live auditors have clean files to patch.
#
# NOTE: fetch_matches.py now always sends an explicit ?season= to the API even
# in "current season" mode (see config.get_current_season_start_year()) — this
# was the fix for PD/CL returning stale previous-season data while PL/FL1 had
# already rolled over. No workflow-level change was needed for that fix.

on:
  schedule:
    - cron: "0 4 * * 0"   # Sunday 04:00 UTC
  workflow_dispatch:     # Allows manual override triggers via GitHub UI

env:
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  PYTHONUNBUFFERED: "1"

jobs:
  fetch-matches:
    name: "Exhaustive fetch of all season fixtures"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full match fetch
        run: python workers/fetch_matches.py

      - name: Commit complete match logs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore(data): full master match logs refreshed [skip ci]"

          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Pushed successfully on attempt $i."
                exit 0
              fi
            else
              echo "Rebase conflict on attempt $i — aborting rebase and retrying."
              git rebase --abort || true
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "::error::Failed to push after 5 attempts — check for a real conflict."
          exit 1
