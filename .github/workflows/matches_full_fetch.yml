name: "Matches — Full Fetch (Current Season)"

# Runs once a week — Sunday 04:00 UTC.
# Exhaustively re-fetches the entire season fixture grid for all active competitions.
# Acts as a master baseline so the incremental live auditors have clean files to patch.
#
# SCOPE: current active season only.
# fetch_matches.py (no --season flag) auto-resolves the season via
# config.get_current_season_start_year(). It always passes an explicit
# ?season= to the API to avoid the per-competition rollover drift bug.
#
# WC / EC note: if the current season folder contains WC or EC,
# fetch_matches.py will attempt them. If the tournament hasn't started
# yet (SCHEDULED matches only) the file will still write correctly with
# future fixtures. If the API returns 404 for a cup competition that
# isn't active in this season window, the Conditional Fallback kicks in
# (preserves the existing file unchanged) — no error, no data loss.

on:
  schedule:
    - cron: "0 4 * * 0"   # Sunday 04:00 UTC
  workflow_dispatch:

env:
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  PYTHONUNBUFFERED: "1"

jobs:
  fetch-matches:
    name: "Full fetch of all current-season fixtures"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full match fetch (current season)
        run: python workers/fetch_matches.py

      - name: Commit complete match logs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore(data): weekly full match fetch — current season [skip ci]"

          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Pushed successfully on attempt $i."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "::error::Failed to push after 5 attempts."
          exit 1
