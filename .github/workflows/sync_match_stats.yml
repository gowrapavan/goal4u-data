name: "Match Stats — 5-Hour Sync (Current Season)"

# Runs at minute 0 of hours 0, 5, 10, 15, 20 UTC every day.
# Scrapes match stats for ALL competitions, filtering to the current month
# (--month) so the full WC tournament window is always covered regardless
# of which matchweek we're in.
#
# SCOPE: current active season only.
# --force is intentionally OMITTED — existing "Full Time" files are skipped
# to keep the run fast. The hourly audit (match_stats_audit.yml) handles
# catching any remaining gaps across the full season history.
#
# Requires: WEBSHARE_PROXY_URL secret (Cloudflare bypass).
#
# concurrency: prevents two runs (e.g. manual dispatch + scheduled) from
# racing on `git push` after a ~40-minute scrape window.

on:
  schedule:
    - cron: "0 0,5,10,15,20 * * *"
  workflow_dispatch:

env:
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  WEBSHARE_PROXY_URL: ${{ secrets.WEBSHARE_PROXY_URL }}
  PYTHONUNBUFFERED: "1"

concurrency:
  group: match-stats-sync-current
  cancel-in-progress: false

jobs:
  scrape-match-stats:
    name: "Scrape match stats (current season, current month)"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright playwright-stealth

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Scrape match stats (current month)
        run: PYTHONPATH=${{ github.workspace }} xvfb-run --auto-servernum python -m workers.fetch_match_stats --all --month

      - name: Commit and Push Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f data/
          git commit -m "chore(data): 5-hour stats sync — $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]" || echo "No new data to commit"

          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Pushed successfully on attempt $i."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Push attempt $i failed, retrying in 15s..."
            sleep 15
          done

          echo "::error::Failed to push after 5 attempts."
          exit 1
