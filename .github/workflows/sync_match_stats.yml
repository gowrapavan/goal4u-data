name: "Match Stats — 5-Hour Sync"

on:
  schedule:
    # Runs at minute 0 of hours 0, 5, 10, 15, 20 UTC every day
    - cron: "0 0,5,10,15,20 * * *"

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:

env:
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  WEBSHARE_PROXY_URL: ${{ secrets.WEBSHARE_PROXY_URL }}
  PYTHONUNBUFFERED: "1"

# Prevent two runs of this workflow (e.g. a manual dispatch overlapping a
# scheduled run) from both checking out main, scraping for ~40min, and then
# racing each other on `git push` — that race is what caused the
# "! [rejected] main -> main (fetch first)" failure.
concurrency:
  group: match-stats-sync
  cancel-in-progress: false

jobs:
  scrape-match-stats:
    name: "Scrape match stats"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright playwright-stealth

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Scrape match stats
        # --month instead of --week so the full WC tournament window is always covered.
        # --force is intentionally OMITTED — existing files are skipped to keep the run fast.
        run: PYTHONPATH=${{ github.workspace }} xvfb-run --auto-servernum python -m workers.fetch_match_stats --all --month

      - name: Commit and Push Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f data/
          git commit -m "chore(data): automated 5-hour stats sync [skip ci]" || echo "No new data to commit"
          # The scrape step can take 5-40+ minutes. If anything else pushed
          # to main while this job was running, a plain `git push` gets
          # rejected as non-fast-forward (this is what failed before — the
          # scrape itself succeeded, only the push didn't). Rebase onto the
          # latest main and retry instead of dying on that race.
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Pushed successfully on attempt $i."
                exit 0
              fi
            else
              echo "Rebase conflict on attempt $i — aborting rebase and retrying."
              git rebase --abort || true
            fi
            echo "Push attempt $i failed, retrying in 15s..."
            sleep 15
          done

          echo "::error::Failed to push after 5 attempts — check for a real conflict."
          exit 1
