name: Euro Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: euro-sync
  cancel-in-progress: false

env:
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  PYTHONUNBUFFERED: "1"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Stats scraping (match_links / match_stats / Playwright) removed:
      # the stats source is down. Match data only.
      - name: Audit Euro matches
        run: python -m workers.fetch_Euro --mode audit --lookback 168

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "chore(euro): audit tournament data"

          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase "origin/${GITHUB_REF_NAME}"; then
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep $((i * 5))
          done
          exit 1
