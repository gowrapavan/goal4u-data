name: "Matches — Live Audit"

# Runs every 15 min between 12:00–23:45 UTC daily.
# Extended to 12:00 UTC start (was 13:00) so it catches midday European KOs.
# WC 2026 has early-afternoon UTC slots (e.g. 18:00 local / 21:00 UTC) as well
# as Americas slots (00:00–03:00 UTC) — those are covered by matches_audit_recent.
#
# Only re-fetches matches that are IN_PLAY, PAUSED, or SCHEDULED with a past utcDate.
# After any match updates, also re-fetches standings for the affected competition.
#
# SCOPE: current active season only — audit_matches.py reads get_season_paths()
# which always resolves to the active folder (e.g. 2026-2027 right now).
# It never touches historical season folders.

on:
  schedule:
    - cron: "0,15,30,45 12-23 * * *"
  workflow_dispatch:

env:
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  PYTHONUNBUFFERED: "1"

jobs:
  audit-live:
    name: "Patch live & just-finished matches + refresh standings"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live audit (lookback 12h)
        run: python workers/audit_matches.py --mode live

      - name: Commit patched match files + refreshed standings
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore(data): live match audit + standings refresh [skip ci]"

          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Pushed successfully on attempt $i."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "::error::Failed to push after 5 attempts."
          exit 1
