name: "Match Stats — Hourly Audit (Current Season, 50/run)"

# Runs every hour at minute 30 (offset from the links workflow at :00).
# Scans ALL finished matches in the current season folder for missing stat files,
# fetches up to 50 per run, defers the rest to the next hourly run.
#
# SCOPE: current active season only.
# fetch_match_stats reads SEASON from config (or DATA_DIR/SEASON env vars),
# which resolves to the active season folder automatically.
#
# No --force flag — existing "Full Time" stat files are skipped so the
# 50-fetch budget is never wasted on re-scraping complete records.
#
# Requires: WEBSHARE_PROXY_URL secret (Cloudflare bypass).

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

env:
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  WEBSHARE_PROXY_URL: ${{ secrets.WEBSHARE_PROXY_URL }}
  PYTHONUNBUFFERED: "1"

concurrency:
  group: match-stats-audit-current
  cancel-in-progress: false

jobs:
  audit-match-stats:
    name: "Audit + scrape missing match stats (current season)"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright playwright-stealth

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Audit + scrape missing match stats
        run: PYTHONPATH=${{ github.workspace }} xvfb-run --auto-servernum python -m workers.fetch_match_stats --audit --all --limit 50

      - name: Commit and Push Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f data/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(data): hourly stats audit — $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"

          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Pushed successfully on attempt $i."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "::error::Failed to push after 5 attempts."
          exit 1
