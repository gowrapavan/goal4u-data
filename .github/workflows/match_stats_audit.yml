name: "Match Stats — Hourly Audit (50/run)"

on:
  schedule:
    # Runs every hour at minute 30 (offset from the links workflow at :00)
    - cron: "30 * * * *"

  # Manual trigger — no inputs, same behaviour as the scheduled run
  workflow_dispatch:

env:
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  WEBSHARE_PROXY_URL: ${{ secrets.WEBSHARE_PROXY_URL }}
  PYTHONUNBUFFERED: "1"

jobs:
  audit-match-stats:
    name: "Audit + scrape missing match stats"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright playwright-stealth

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Scans ALL competitions for FINISHED matches that have no stat file on disk.
      # Fetches at most 50 per run (hardcoded in the script default).
      # No date filter — covers every finished match across the whole season,
      # not just the current week/month, so nothing gets permanently missed.
      # Deferred matches are picked up automatically on the next hourly run.
      - name: Commit and Push Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add -f data/

          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "chore: hourly stats audit — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Sync with latest main
          git pull --rebase origin main

          git push origin main