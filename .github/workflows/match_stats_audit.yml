name: "Match Stats — Hourly Audit (50/run)"

on:
  schedule:
    # Runs every hour at minute 30 (offset from the links workflow at :00)
    - cron: "30 * * * *"

  # Manual trigger — no inputs, same behaviour as the scheduled run
  workflow_dispatch:

env:
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  WEBSHARE_PROXY_URL: ${{ secrets.WEBSHARE_PROXY_URL }}
  PYTHONUNBUFFERED: "1"

jobs:
  audit-match-stats:
    name: "Audit + scrape missing match stats"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright playwright-stealth

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Scans ALL competitions for FINISHED matches that have no stat file on disk.
      # Fetches at most 50 per run (--limit). Existing stat files are pre-scanned
      # and excluded so the 50-fetch budget is never wasted on skips.
      # No date filter — covers every finished match across the whole season,
      # not just the current week/month, so nothing gets permanently missed.
      # Deferred matches are picked up automatically on the next hourly run.
      - name: Audit + scrape missing match stats
        run: PYTHONPATH=${{ github.workspace }} xvfb-run --auto-servernum python -m workers.fetch_match_stats --audit --all --limit 50

      - name: Commit and Push Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f data/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(data): hourly stats audit — $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"

          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Pushed successfully on attempt $i."
                exit 0
              fi
            else
              echo "Rebase conflict on attempt $i — aborting rebase and retrying."
              git rebase --abort || true
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "::error::Failed to push after 5 attempts — check for a real conflict."
          exit 1
