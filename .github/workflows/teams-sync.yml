name: Teams Sync

# Fetches teams + squads + coach (teams.json) and competition metadata
# (competitionInfo.json) for all leagues into data/<season>/<CODE>/.
# About 14 API calls, ~2 minutes.
#   - weekly (Mondays) during transfer windows: Jan and Jul-Sep
#   - monthly (1st) the rest of the year
# Run it manually once to create the 2026-2027 files.
on:
  schedule:
    - cron: "0 5 * 1,7,8,9 1"
    - cron: "0 5 1 2,3,4,5,6,10,11,12 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: teams-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch teams and squads (all leagues)
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python -m workers.fetch_teams

      - name: Fetch competition info (all leagues)
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python -m workers.fetch_competitions --mode info

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data
          git diff --cached --quiet && exit 0
          git commit -m "teams + competition info sync"

          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase "origin/${GITHUB_REF_NAME}"; then
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep $((i * 5))
          done
          exit 1