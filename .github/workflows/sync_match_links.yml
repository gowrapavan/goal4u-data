name: "Match Links — Weekly Sync (Current Season)"

# Runs every Monday at 02:00 UTC (well before the week's first fixtures).
# Scrapes yallashoot.soccer competition pages to extract match URLs and
# fuzzy-maps them to football-data match IDs.
#
# SCOPE: current active season only.
# fetch_match_links.py (--all) reads TRACKED_COMPETITIONS and the current
# season folder from config automatically.
#
# WC 2026 note: get_competition_url() in fetch_match_links.py already handles
# WC correctly — it uses year_end (e.g. "2026") for the URL slug:
#   world-cup-2026  →  https://yallashoot.soccer/competition/world-cup-2026/
# This is independent of which season folder the data lands in.
#
# Requires: WEBSHARE_PROXY_URL secret (rotating proxy for CF bypass).
# Playwright + Xvfb are installed at runtime for Chromium-based CF solving.

on:
  schedule:
    - cron: "0 2 * * 1"   # Monday 02:00 UTC
  workflow_dispatch:

env:
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  WEBSHARE_PROXY_URL: ${{ secrets.WEBSHARE_PROXY_URL }}
  PYTHONUNBUFFERED: "1"

jobs:
  sync-match-links:
    name: "Sync match links (current season)"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright playwright-stealth

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Sync match links (all competitions)
        run: PYTHONPATH=${{ github.workspace }} xvfb-run --auto-servernum python -m workers.fetch_match_links --all

      - name: Commit and Push Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f data/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore(data): weekly match links sync [skip ci]"

          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Pushed successfully on attempt $i."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "::error::Failed to push after 5 attempts."
          exit 1
