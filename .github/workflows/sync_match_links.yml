name: "Match Links — Weekly Sync"

on:
  schedule:
    # Runs every Monday at 02:00 UTC (well before the week's first fixtures)
    - cron: "0 2 * * 1"

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:

env:
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  WEBSHARE_PROXY_URL: ${{ secrets.WEBSHARE_PROXY_URL }}
  PYTHONUNBUFFERED: "1"

jobs:
  sync-match-links:
    name: "Sync match links"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright playwright-stealth

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Sync match links
        run: PYTHONPATH=${{ github.workspace }} xvfb-run --auto-servernum python -m workers.fetch_match_links --all

      - name: Commit and Push Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f data/
          git commit -m "chore: weekly match links sync" || echo "No new data to commit"
          git push