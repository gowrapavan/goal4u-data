name: "Matches — Recent Audit"

# Runs every 3 hours around the clock
# Catches matches from the last 72h that are still stale
# (status never updated, goals missing, lineup empty, etc.)
# After any match updates, also re-fetches standings for the affected competition.

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

env:
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  PYTHONUNBUFFERED: "1"

jobs:
  audit-recent:
    name: "Patch matches from last 3 days + refresh standings"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run recent audit (lookback 72h)
        run: python workers/audit_matches.py --mode recent

      - name: Commit patched match files + refreshed standings
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore(data): recent match audit + standings refresh [skip ci]"
          git push