name: "Matches — Recent Audit"

# Runs every 3 hours around the clock.
# Catches matches from the last 72h that are still stale —
# status never updated, goals missing, lineup empty, etc.
#
# Also catches late-night Americas WC 2026 slots (00:00–03:00 UTC)
# that fall outside the live-audit window (12:00–23:45 UTC).
# The 12h grace window inside audit_matches._is_stale() means a 01:00 UTC
# kick-off is still caught by the 03:00 / 06:00 UTC recent-audit runs.
#
# After any match updates, also re-fetches standings for the affected competition.
#
# SCOPE: current active season only (same as live audit above).

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

env:
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  PYTHONUNBUFFERED: "1"

jobs:
  audit-recent:
    name: "Patch matches from last 3 days + refresh standings"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run recent audit (lookback 72h)
        run: python workers/audit_matches.py --mode recent

      - name: Commit patched match files + refreshed standings
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore(data): recent match audit + standings refresh [skip ci]"

          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Pushed successfully on attempt $i."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "::error::Failed to push after 5 attempts."
          exit 1
