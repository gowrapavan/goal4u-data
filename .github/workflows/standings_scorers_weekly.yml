name: "Standings & Scorers — Weekly Sync"

# Runs every Monday at 07:00 UTC
# Re-fetches full standings tables and top scorers for all 8 competitions
# Single API call per competition — cheap and fast

on:
  schedule:
    - cron: "0 7 * * 1"   # Monday 07:00 UTC
  workflow_dispatch:

env:
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  PYTHONUNBUFFERED: "1"

jobs:
  sync-standings-scorers:
    name: "Sync standings + scorers (all competitions)"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync standings
        run: python workers/fetch_competitions.py --mode standings

      - name: Sync scorers
        run: python workers/fetch_competitions.py --mode scorers

      - name: Commit updated standings + scorers
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore(data): weekly standings + scorers sync [skip ci]"
          git push