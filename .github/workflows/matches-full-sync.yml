name: Matches Full Sync

# One API call per competition returns the whole season, so this is cheap
# (7 calls) and is what creates data/<season>/<CODE>/matches.json the first
# time, and picks up reschedules / kickoff-time changes afterwards.
# Run it manually once (Actions -> Matches Full Sync -> Run workflow).
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matches-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Full season fetch (all leagues)
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python -m workers.fetch_matches

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data
          git diff --cached --quiet && exit 0
          git commit -m "matches full sync"

          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase "origin/${GITHUB_REF_NAME}"; then
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep $((i * 5))
          done
          exit 1
