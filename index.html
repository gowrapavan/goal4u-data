<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goal4U Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Design tokens ─────────────────────────────────────────── */
    :root {
      --pitch:       #0a1f0e;
      --surface:     #122b16;
      --surface-2:   #1a3a1e;
      --surface-3:   #213f26;
      --border:      #2a5030;
      --accent:      #00e676;
      --accent-dim:  #00b04e;
      --accent-mute: rgba(0,230,118,0.08);
      --text:        #e8f5e9;
      --text-dim:    #81c784;
      --text-muted:  #4caf50;
      --live:        #ff5252;
      --live-bg:     rgba(255,82,82,0.12);
      --yellow:      #ffd740;
      --radius:      6px;
      --radius-lg:   12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--pitch);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Ticker ───────────────────────────────────────────────── */
    .ticker {
      background: var(--accent);
      color: #000;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      white-space: nowrap;
      overflow: hidden;
      height: 26px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .ticker-label {
      background: #000;
      color: var(--accent);
      padding: 0 14px;
      height: 100%;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      font-size: 10px;
      letter-spacing: 0.15em;
    }
    .ticker-track-wrap { overflow: hidden; flex: 1; }
    .ticker-track {
      display: inline-flex;
      gap: 48px;
      animation: ticker-scroll 28s linear infinite;
    }
    .ticker-track span::before { content: '◆ '; }
    @keyframes ticker-scroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* ── Shell ────────────────────────────────────────────────── */
    .shell { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ──────────────────────────────────────────────── */
    .sidebar {
      width: 230px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
    }
    .sidebar-logo {
      padding: 20px 18px 14px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo .wordmark {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--accent);
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .sidebar-logo .tagline {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      margin-top: 3px;
    }

    /* ── Season selector ──────────────────────────────────────── */
    .season-picker {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .season-picker-label {
      font-size: 9px;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 7px;
    }
    .season-select-wrap {
      position: relative;
    }
    .season-select-wrap::after {
      content: '▾';
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent);
      font-size: 12px;
      pointer-events: none;
    }
    .season-select {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 28px 7px 10px;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      transition: border-color 0.15s;
      font-family: 'Inter', sans-serif;
    }
    .season-select:focus { outline: none; border-color: var(--accent-dim); }
    .season-select option { background: #122b16; }

    .sidebar-section-label {
      padding: 12px 18px 5px;
      font-size: 9px;
      letter-spacing: 0.18em;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .comp-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 18px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-dim);
      border: none;
      background: none;
      text-align: left;
      width: 100%;
      transition: background 0.15s, color 0.15s;
      border-left: 3px solid transparent;
    }
    .comp-btn:hover { background: var(--accent-mute); color: var(--text); }
    .comp-btn.active {
      background: var(--accent-mute);
      color: var(--accent);
      border-left-color: var(--accent);
      font-weight: 600;
    }
    .comp-btn .code-badge {
      margin-left: auto;
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }
    .sidebar-divider { height: 1px; background: var(--border); margin: 8px 0; }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); }

    /* ── Main panel ───────────────────────────────────────────── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .panel-header {
      padding: 18px 24px 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-title-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .panel-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px;
      color: var(--accent);
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .panel-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .season-badge {
      display: inline-block;
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.06em;
      margin-top: 2px;
    }

    /* ── Tabs ─────────────────────────────────────────────────── */
    .tabs { display: flex; gap: 2px; }
    .tab-btn {
      padding: 8px 18px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Panel body ───────────────────────────────────────────── */
    .panel-body { flex: 1; overflow-y: auto; padding: 22px 24px; }
    .panel-body::-webkit-scrollbar { width: 6px; }
    .panel-body::-webkit-scrollbar-track { background: transparent; }
    .panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Loading / error ──────────────────────────────────────── */
    .state-msg {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 200px;
      gap: 10px;
      color: var(--text-muted);
      font-size: 13px;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Standings ────────────────────────────────────────────── */
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    .data-table th {
      padding: 8px 12px;
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .data-table th.num, .data-table td.num { text-align: right; }
    .data-table td {
      padding: 9px 12px;
      border-bottom: 1px solid rgba(42,80,48,0.5);
      color: var(--text);
    }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: var(--accent-mute); }
    .team-cell { display: flex; align-items: center; gap: 10px; }
    .team-crest { width: 22px; height: 22px; object-fit: contain; flex-shrink: 0; }
    .team-crest-ph { width: 22px; height: 22px; border-radius: 50%; background: var(--surface-3); flex-shrink: 0; }
    .pos-num { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 4px; font-weight: 700; font-size: 12px; }
    .pts-badge { display: inline-block; background: var(--accent-mute); color: var(--accent); border-radius: 4px; padding: 2px 8px; font-weight: 700; font-size: 13px; }
    .form-dots { display: flex; gap: 3px; }
    .form-dot { width: 8px; height: 8px; border-radius: 50%; }
    .form-W { background: var(--accent); }
    .form-D { background: var(--yellow); }
    .form-L { background: var(--live); }

    /* ── Matches ──────────────────────────────────────────────── */
    .filter-bar { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
    .filter-btn {
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover, .filter-btn.active { background: var(--accent-mute); border-color: var(--accent-dim); color: var(--accent); }
    .matchday-group { margin-bottom: 24px; }
    .matchday-label { font-size: 10px; letter-spacing: 0.14em; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; }
    .match-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 6px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .match-card:hover { border-color: var(--accent-dim); background: var(--surface-2); }
    .match-card.live { border-color: var(--live); background: var(--live-bg); }
    .match-card.has-stats { border-color: var(--border); }
    .match-card.has-stats:hover { border-color: var(--accent); }
    .match-team { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; }
    .match-team.away { justify-content: flex-end; flex-direction: row-reverse; }
    .match-score-block { text-align: center; flex-shrink: 0; }
    .match-score { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 0.06em; color: var(--accent); line-height: 1; }
    .match-score.pending { color: var(--text-muted); font-size: 16px; }
    .match-time { font-size: 10px; color: var(--text-muted); margin-top: 2px; letter-spacing: 0.06em; }
    .status-pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; }
    .status-FINISHED  { background: var(--surface-3); color: var(--text-muted); }
    .status-IN_PLAY   { background: var(--live-bg); color: var(--live); }
    .status-PAUSED    { background: var(--live-bg); color: var(--live); }
    .status-TIMED, .status-SCHEDULED { background: var(--accent-mute); color: var(--accent); }
    .status-POSTPONED { background: rgba(255,215,64,0.1); color: var(--yellow); }
    .status-default   { background: var(--surface-3); color: var(--text-muted); }

    /* ── Scorers ──────────────────────────────────────────────── */
    .scorer-row {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 6px;
      transition: border-color 0.15s;
    }
    .scorer-row:hover { border-color: var(--accent-dim); }
    .scorer-rank { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--text-muted); width: 30px; flex-shrink: 0; line-height: 1; }
    .scorer-rank.top { color: var(--accent); }
    .scorer-info { flex: 1; min-width: 0; }
    .scorer-name { font-weight: 600; font-size: 14px; }
    .scorer-team { font-size: 11px; color: var(--text-muted); margin-top: 1px; display: flex; align-items: center; gap: 4px; }
    .scorer-stats { display: flex; gap: 16px; flex-shrink: 0; }
    .stat-pill { text-align: center; }
    .stat-pill .val { font-family: 'Bebas Neue', sans-serif; font-size: 22px; line-height: 1; color: var(--accent); }
    .stat-pill .lbl { font-size: 9px; color: var(--text-muted); letter-spacing: 0.1em; }

    /* ── Teams ────────────────────────────────────────────────── */
    .teams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .team-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 18px 14px 14px;
      text-align: center; cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
    }
    .team-card:hover { border-color: var(--accent-dim); transform: translateY(-2px); }
    .team-card-crest { width: 54px; height: 54px; object-fit: contain; margin: 0 auto 10px; display: block; }
    .team-card-crest-ph { width: 54px; height: 54px; border-radius: 50%; background: var(--surface-3); margin: 0 auto 10px; }
    .team-card-name { font-weight: 600; font-size: 13px; line-height: 1.3; }
    .team-card-meta { font-size: 10px; color: var(--text-muted); margin-top: 4px; }

    .comp-info-banner {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 18px;
      margin-bottom: 20px; display: flex; gap: 32px; flex-wrap: wrap;
    }
    .info-stat .lbl { font-size: 10px; color: var(--text-muted); letter-spacing: 0.1em; margin-bottom: 3px; }
    .info-stat .val { font-size: 14px; font-weight: 600; }
    .group-section { margin-bottom: 28px; }
    .group-label {
      font-family: 'Bebas Neue', sans-serif; font-size: 18px;
      color: var(--accent); letter-spacing: 0.06em; margin-bottom: 8px;
      border-bottom: 1px solid var(--border); padding-bottom: 4px;
    }

    /* ══════════════════════════════════════════════════════════
       STATS TAB — match list + drill-down
       ══════════════════════════════════════════════════════════ */
    .stats-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 18px;
      height: 100%;
      min-height: 0;
    }
    .stats-match-list {
      overflow-y: auto;
      padding-right: 4px;
    }
    .stats-match-list::-webkit-scrollbar { width: 4px; }
    .stats-match-list::-webkit-scrollbar-track { background: transparent; }
    .stats-match-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .stats-match-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .stats-match-item:hover { border-color: var(--accent-dim); background: var(--surface-2); }
    .stats-match-item.active { border-color: var(--accent); background: var(--accent-mute); }
    .stats-match-item.no-stats { opacity: 0.45; cursor: default; }
    .stats-match-item.no-stats:hover { border-color: var(--border); background: var(--surface); }
    .smi-teams {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; font-weight: 600;
      gap: 6px;
    }
    .smi-score {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px; color: var(--accent); white-space: nowrap;
    }
    .smi-meta { font-size: 10px; color: var(--text-muted); margin-top: 4px; display: flex; gap: 8px; }
    .smi-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 0.06em;
      padding: 1px 6px; border-radius: 10px;
    }
    .smi-badge.has  { background: var(--accent-mute); color: var(--accent); }
    .smi-badge.none { background: var(--surface-3);   color: var(--text-muted); }

    /* ── Stats detail panel ───────────────────────────────────── */
    .stats-detail {
      overflow-y: auto;
      min-height: 0;
    }
    .stats-detail::-webkit-scrollbar { width: 4px; }
    .stats-detail::-webkit-scrollbar-track { background: transparent; }
    .stats-detail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .stats-placeholder {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 12px; color: var(--text-muted); font-size: 13px;
    }
    .stats-placeholder .icon { font-size: 40px; opacity: 0.4; }

    /* Match header in stats detail */
    .sd-header {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      margin-bottom: 16px;
    }
    .sd-teams-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      margin-bottom: 10px;
    }
    .sd-team { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
    .sd-team.away { flex-direction: row-reverse; text-align: right; }
    .sd-score-block { text-align: center; }
    .sd-score {
      font-family: 'Bebas Neue', sans-serif; font-size: 38px;
      color: var(--accent); letter-spacing: 0.06em; line-height: 1;
    }
    .sd-ht { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .sd-meta-row { display: flex; gap: 12px; justify-content: center; font-size: 11px; color: var(--text-muted); }

    /* ── Pitch split viz (possession) ─────────────────────────── */
    .pitch-split-wrap { margin-bottom: 16px; }
    .pitch-split-label {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 10px; letter-spacing: 0.12em; color: var(--text-muted);
      margin-bottom: 6px; text-transform: uppercase;
    }
    .pitch-split-label .pct { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--text); }
    .pitch-split-label .pct.home { color: var(--accent); }
    .pitch-split-label .pct.away { color: var(--text-dim); }
    .pitch-bar {
      height: 34px;
      border-radius: 4px;
      overflow: hidden;
      background: var(--surface-3);
      display: flex;
      position: relative;
    }
    .pitch-bar-home {
      background: linear-gradient(90deg, var(--accent-dim), var(--accent));
      transition: width 0.6s cubic-bezier(.4,0,.2,1);
      display: flex; align-items: center; justify-content: flex-end;
      padding-right: 8px;
      font-size: 11px; font-weight: 700; color: #000;
    }
    .pitch-bar-away {
      flex: 1;
      background: linear-gradient(90deg, #1a5a2a, var(--surface-3));
      display: flex; align-items: center; padding-left: 8px;
      font-size: 11px; font-weight: 700; color: var(--text-muted);
    }
    /* Centre line */
    .pitch-bar::after {
      content: '';
      position: absolute;
      left: 50%; top: 0; bottom: 0;
      width: 1px;
      background: rgba(255,255,255,0.08);
    }

    /* ── Stat bars (the main stats grid) ──────────────────────── */
    .stat-bars-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .stat-bars-title {
      font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
      color: var(--text-muted); text-transform: uppercase;
      margin-bottom: 14px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .stat-row-item {
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .stat-row-item:last-child { margin-bottom: 0; }
    .stat-val-home { font-size: 13px; font-weight: 700; color: var(--accent); text-align: left; }
    .stat-val-away { font-size: 13px; font-weight: 700; color: var(--text-dim); text-align: right; }
    .stat-bar-dual {
      display: flex;
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      background: var(--surface-3);
      gap: 1px;
    }
    .stat-bar-dual-home {
      background: var(--accent);
      border-radius: 3px 0 0 3px;
      transition: width 0.5s ease;
    }
    .stat-bar-dual-away {
      flex: 1;
      background: var(--surface-3);
      border-radius: 0 3px 3px 0;
    }
    .stat-name {
      text-align: center; font-size: 10px; color: var(--text-muted);
      letter-spacing: 0.06em; white-space: nowrap;
      grid-column: 1 / -1; margin-top: -6px; margin-bottom: 4px;
    }

    /* Better dual-bar layout */
    .stat-row-full {
      margin-bottom: 12px;
    }
    .stat-row-full:last-child { margin-bottom: 0; }
    .stat-row-nums {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 4px;
    }
    .stat-row-nums .home-val { font-size: 14px; font-weight: 700; color: var(--accent); }
    .stat-row-nums .name-lbl { font-size: 10px; color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase; }
    .stat-row-nums .away-val { font-size: 14px; font-weight: 700; color: var(--text-dim); }
    .dual-bar {
      height: 5px; border-radius: 3px; background: var(--surface-3);
      display: flex; overflow: hidden;
    }
    .dual-bar-home {
      height: 100%; background: var(--accent);
      border-radius: 3px 0 0 3px;
      transition: width 0.55s cubic-bezier(.4,0,.2,1);
    }
    .dual-bar-away {
      height: 100%; background: var(--text-muted);
      border-radius: 0 3px 3px 0;
      transition: width 0.55s cubic-bezier(.4,0,.2,1);
    }

    /* ── Events timeline ──────────────────────────────────────── */
    .events-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .events-title {
      font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
      color: var(--text-muted); text-transform: uppercase;
      margin-bottom: 14px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .events-list { display: flex; flex-direction: column; gap: 6px; }
    .event-item {
      display: grid;
      grid-template-columns: 1fr 48px 1fr;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .event-home { text-align: right; }
    .event-away { text-align: left; }
    .event-minute {
      text-align: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      color: var(--text-muted);
      background: var(--surface-2);
      border-radius: 3px;
      padding: 2px 4px;
    }
    .event-minute.goal { color: var(--accent); background: var(--accent-mute); }
    .event-minute.yellow_card { color: var(--yellow); background: rgba(255,215,64,0.1); }
    .event-minute.red_card { color: var(--live); background: var(--live-bg); }
    .event-player { font-weight: 500; }
    .event-icon { font-size: 10px; }

    /* ── Lineups ──────────────────────────────────────────────── */
    .lineups-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .lineups-title {
      font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
      color: var(--text-muted); text-transform: uppercase;
      margin-bottom: 14px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .lineups-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .lineup-side-title {
      font-size: 11px; font-weight: 700; color: var(--text-dim);
      margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
    }
    .lineup-formation {
      display: inline-block; font-size: 10px; color: var(--accent);
      background: var(--accent-mute); border-radius: 3px; padding: 1px 6px;
    }
    .lineup-player {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 0;
      border-bottom: 1px solid rgba(42,80,48,0.3);
      font-size: 12px;
    }
    .lineup-player:last-child { border-bottom: none; }
    .lineup-num {
      width: 22px; height: 22px; border-radius: 3px;
      background: var(--surface-3);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; color: var(--text-muted);
      flex-shrink: 0;
    }
    .lineup-subs-label {
      font-size: 9px; letter-spacing: 0.12em; color: var(--text-muted);
      text-transform: uppercase; margin: 8px 0 4px; padding-top: 6px;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 900px) {
      .stats-layout { grid-template-columns: 1fr; }
      .stats-detail { min-height: 400px; }
    }
    @media (max-width: 680px) {
      .sidebar { width: 180px; }
      .match-team span.name { display: none; }
    }
  </style>
</head>
<body>

<div class="ticker">
  <div class="ticker-label">LIVE</div>
  <div class="ticker-track-wrap">
    <div class="ticker-track" id="ticker-track">
      <span>Premier League</span><span>La Liga</span><span>Bundesliga</span>
      <span>Ligue 1</span><span>Serie A</span><span>Champions League</span>
      <span>Championship</span><span>FIFA World Cup 2026</span>
    </div>
  </div>
</div>

<div class="shell">

  <!-- ── Sidebar ─────────────────────────────────────────────── -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="wordmark">Goal4U</div>
      <div class="tagline">DATA ANALYTICS</div>
    </div>

    <!-- Season picker -->
    <div class="season-picker">
      <div class="season-picker-label">Season</div>
      <div class="season-select-wrap">
        <select class="season-select" id="season-select">
          <!-- populated by JS -->
        </select>
      </div>
    </div>

    <div class="sidebar-section-label">Leagues</div>
    <div id="league-nav"></div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section-label">Tournaments</div>
    <div id="tournament-nav"></div>
  </nav>

  <!-- ── Main panel ──────────────────────────────────────────── -->
  <div class="main">
    <div class="panel-header" id="panel-header">
      <div class="panel-title-row">
        <div>
          <div class="panel-title" id="panel-title">Select a competition</div>
          <div class="panel-meta" id="panel-meta"></div>
          <div id="season-badge-wrap"></div>
        </div>
      </div>
      <div class="tabs" id="tab-strip"></div>
    </div>
    <div class="panel-body" id="panel-body">
      <div class="state-msg">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:40px;color:var(--accent)">Goal4U</div>
        <div>Select a competition from the sidebar</div>
      </div>
    </div>
  </div>

</div>

<script>
/* ════════════════════════════════════════════════════════════
   CONFIG
   ════════════════════════════════════════════════════════════ */
const DATA_ROOT = './data';

// All available seasons — newest first. Add new ones here each year.
const ALL_SEASONS = [
  '2026-2027',
  '2025-2026',
  '2024-2025',
  '2023-2024',
];
const DEFAULT_SEASON = '2025-2026';

const LEAGUE_COMPS = [
  { code: 'PL',  name: 'Premier League',    flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿' },
  { code: 'PD',  name: 'La Liga',           flag: '🇪🇸' },
  { code: 'BL1', name: 'Bundesliga',        flag: '🇩🇪' },
  { code: 'FL1', name: 'Ligue 1',           flag: '🇫🇷' },
  { code: 'SA',  name: 'Serie A',           flag: '🇮🇹' },
  { code: 'CL',  name: 'Champions League', flag: '🇪🇺' },
  { code: 'ELC', name: 'Championship',     flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿' },
];

// Tournaments: root is fixed (not season-based), but we expose them in nav
const TOURNAMENT_DEFS = [
  { code: 'WC', name: 'World Cup 2026', flag: '🌍', fixedRoot: `${DATA_ROOT}/world-cup/world-cup-2026` },
  { code: 'WC', name: 'World Cup 2022', flag: '🌍', fixedRoot: `${DATA_ROOT}/world-cup/world-cup-2022` },
  { code: 'EC', name: 'UEFA Euro 2024', flag: '🇪🇺', fixedRoot: `${DATA_ROOT}/euros/euro-2024` },
  { code: 'EC', name: 'UEFA Euro 2028', flag: '🇪🇺', fixedRoot: `${DATA_ROOT}/euros/euro-2028` },
];

/* ════════════════════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════════════════════ */
let currentSeason    = DEFAULT_SEASON;
let currentComp      = null;
let currentTab       = 'standings';
let currentFilter    = 'all';
let currentStatsMatch = null;   // match obj currently shown in stats detail
let cachedData       = {};
let currentCompInfo  = null;

/* ════════════════════════════════════════════════════════════
   HELPERS
   ════════════════════════════════════════════════════════════ */
async function loadJSON(url) {
  if (cachedData[url]) return cachedData[url];
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    const j = await r.json();
    cachedData[url] = j.data ?? j;
    return cachedData[url];
  } catch { return null; }
}

function leagueRoot(code, season) {
  return `${DATA_ROOT}/${season}/${code}`;
}
function compRoot(comp) {
  if (comp.fixedRoot) return comp.fixedRoot;
  return leagueRoot(comp.code, currentSeason);
}
function isTournament(comp) { return !!comp.fixedRoot; }

function fmt(v)   { return (v !== null && v !== undefined) ? v : '—'; }
function fmtDate(utc) {
  if (!utc) return '—';
  return new Date(utc).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
}
function fmtTime(utc) {
  if (!utc) return '';
  return new Date(utc).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}
function statusClass(s) {
  return ['FINISHED','IN_PLAY','PAUSED','TIMED','SCHEDULED','POSTPONED'].includes(s)
    ? `status-${s}` : 'status-default';
}
function statusLabel(s) {
  return ({ FINISHED:'FT', IN_PLAY:'LIVE', PAUSED:'HT', TIMED:'SCHED',
            SCHEDULED:'SCHED', POSTPONED:'POSTP', CANCELLED:'CANC' })[s] || s || '—';
}
function imgOrPh(src, cls, phCls) {
  if (src) return `<img src="${src}" class="${cls}" loading="lazy" onerror="this.style.display='none'"/>`;
  return `<div class="${phCls}"></div>`;
}
function formDots(form) {
  if (!form) return '';
  return `<div class="form-dots">${form.split('').slice(-5).map(c =>
    `<div class="form-dot form-${c}"></div>`).join('')}</div>`;
}
function loading() {
  return `<div class="state-msg"><div class="spinner"></div><div>Loading…</div></div>`;
}
function noData(msg = 'No data available.') {
  return `<div class="state-msg"><div style="font-size:28px">📭</div><div>${msg}</div></div>`;
}

/* ════════════════════════════════════════════════════════════
   SEASON SELECTOR
   ════════════════════════════════════════════════════════════ */
function buildSeasonSelect() {
  const sel = document.getElementById('season-select');
  ALL_SEASONS.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s;
    if (s === DEFAULT_SEASON) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => {
    currentSeason = sel.value;
    cachedData = {};   // clear cache so new season data is fetched fresh
    if (currentComp && !isTournament(currentComp)) {
      selectComp(currentComp);  // reload with new season
    }
    updateSeasonBadge();
  });
}

function updateSeasonBadge() {
  const wrap = document.getElementById('season-badge-wrap');
  if (currentComp && !isTournament(currentComp)) {
    wrap.innerHTML = `<div class="season-badge">${currentSeason}</div>`;
  } else {
    wrap.innerHTML = '';
  }
}

/* ════════════════════════════════════════════════════════════
   SIDEBAR
   ════════════════════════════════════════════════════════════ */
function buildSidebar() {
  const leagueNav = document.getElementById('league-nav');
  const tourNav   = document.getElementById('tournament-nav');

  LEAGUE_COMPS.forEach(comp => {
    const btn = document.createElement('button');
    btn.className = 'comp-btn';
    btn.dataset.code = comp.code;
    btn.innerHTML = `
      <span style="font-size:14px">${comp.flag}</span>
      <span>${comp.name}</span>
      <span class="code-badge">${comp.code}</span>`;
    btn.addEventListener('click', () => selectComp(comp));
    leagueNav.appendChild(btn);
  });

  TOURNAMENT_DEFS.forEach(comp => {
    const btn = document.createElement('button');
    btn.className = 'comp-btn';
    btn.dataset.code = comp.code;
    btn.innerHTML = `
      <span style="font-size:14px">${comp.flag}</span>
      <span>${comp.name}</span>
      <span class="code-badge">${comp.code}</span>`;
    btn.addEventListener('click', () => selectComp(comp));
    tourNav.appendChild(btn);
  });
}

function setActiveNav(code) {
  document.querySelectorAll('.comp-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.code === code));
}

/* ════════════════════════════════════════════════════════════
   COMPETITION SELECT
   ════════════════════════════════════════════════════════════ */
async function selectComp(comp) {
  currentComp       = comp;
  currentFilter     = 'all';
  currentStatsMatch = null;
  setActiveNav(comp.code);
  updateSeasonBadge();

  const infoUrl = `${compRoot(comp)}/competitionInfo.json`;
  currentCompInfo = await loadJSON(infoUrl);

  renderHeader(comp, currentCompInfo);
  buildTabs(comp);
  selectTab('standings');
}

function renderHeader(comp, info) {
  const season = info?.currentSeason;
  const md     = season?.currentMatchday;
  document.getElementById('panel-title').textContent = info?.name ?? comp.name;
  document.getElementById('panel-meta').textContent  =
    [season?.startDate?.slice(0,7), season?.endDate?.slice(0,7)]
      .filter(Boolean).join(' → ')
    + (md ? `  ·  Matchday ${md}` : '');
}

/* ════════════════════════════════════════════════════════════
   TABS
   ════════════════════════════════════════════════════════════ */
const TABS = [
  { id: 'standings', label: 'STANDINGS' },
  { id: 'matches',   label: 'MATCHES'   },
  { id: 'scorers',   label: 'SCORERS'   },
  { id: 'teams',     label: 'TEAMS'     },
  { id: 'stats',     label: 'STATS'     },
];

function buildTabs() {
  const strip = document.getElementById('tab-strip');
  strip.innerHTML = '';
  TABS.forEach(t => {
    const btn = document.createElement('button');
    btn.className   = 'tab-btn';
    btn.textContent = t.label;
    btn.dataset.tab = t.id;
    btn.addEventListener('click', () => selectTab(t.id));
    strip.appendChild(btn);
  });
}

function selectTab(id) {
  currentTab = id;
  document.querySelectorAll('.tab-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === id));
  renderTab(id);
}

/* ════════════════════════════════════════════════════════════
   TAB ROUTER
   ════════════════════════════════════════════════════════════ */
async function renderTab(id) {
  const body = document.getElementById('panel-body');

  if (id === 'stats') {
    // stats tab manages its own layout — don't wipe with loading()
    body.innerHTML = loading();
    const root = compRoot(currentComp);
    const [matches, statsData, links] = await Promise.all([
      loadJSON(`${root}/matches.json`),
      loadJSON(`${root}/stats.json`),
      loadJSON(`${root}/match_stats_links.json`),
    ]);
    body.innerHTML = renderStatsTab(matches, statsData, links);
    // re-attach click handlers
    body.querySelectorAll('.stats-match-item[data-mid]').forEach(el => {
      el.addEventListener('click', () => {
        const mid = el.dataset.mid;
        const match = (matches || []).find(m => String(m.id) === mid);
        const sd    = (statsData || {})[mid];
        if (match && sd) {
          body.querySelectorAll('.stats-match-item').forEach(x => x.classList.remove('active'));
          el.classList.add('active');
          document.getElementById('stats-detail-panel').innerHTML = renderStatsDetail(match, sd);
        }
      });
    });
    return;
  }

  body.innerHTML = loading();
  if (!currentComp) return;

  const root = compRoot(currentComp);

  if (id === 'standings') {
    const data = await loadJSON(`${root}/standing.json`);
    body.innerHTML = data ? renderStandings(data, currentComp.code) : noData();
  } else if (id === 'matches') {
    const data = await loadJSON(`${root}/matches.json`);
    body.innerHTML = data ? renderMatches(data, currentComp.code) : noData();
  } else if (id === 'scorers') {
    const url  = isTournament(currentComp) ? `${root}/scorers.json` : `${root}/topScorer.json`;
    const data = await loadJSON(url);
    body.innerHTML = data ? renderScorers(data) : noData();
  } else if (id === 'teams') {
    const data = await loadJSON(`${root}/teams.json`);
    body.innerHTML = data ? renderTeams(data) : noData();
  }
}

/* ════════════════════════════════════════════════════════════
   STANDINGS
   ════════════════════════════════════════════════════════════ */
function renderStandings(data, code) {
  const groups = data.standings ?? [];
  if (!groups.length) return noData('No standings data yet.');

  let html = '';
  if (currentCompInfo) {
    const cs = currentCompInfo.currentSeason ?? {};
    html += `<div class="comp-info-banner">
      <div class="info-stat"><div class="lbl">SEASON</div>
        <div class="val">${cs.startDate?.slice(0,4) ?? '—'} / ${cs.endDate?.slice(0,4) ?? '—'}</div></div>
      <div class="info-stat"><div class="lbl">MATCHDAY</div>
        <div class="val">${fmt(cs.currentMatchday)}</div></div>
      <div class="info-stat"><div class="lbl">COMPETITION</div>
        <div class="val">${data.display_title ?? code}</div></div>
    </div>`;
  }

  groups.forEach(group => {
    const label = group.group ? `Group ${group.group}`
                               : (group.stage ?? group.type ?? '');
    if (label) html += `<div class="group-label">${label}</div>`;

    html += `<div class="group-section">
    <table class="data-table"><thead><tr>
      <th style="width:36px">#</th><th>Team</th>
      <th class="num">P</th><th class="num">W</th><th class="num">D</th><th class="num">L</th>
      <th class="num">GF</th><th class="num">GA</th><th class="num">GD</th>
      <th class="num">Pts</th><th>Form</th>
    </tr></thead><tbody>`;

    (group.table ?? []).forEach(row => {
      const pos  = row.position;
      const team = row.team ?? {};
      const posStyle = pos <= 4 ? 'background:var(--accent-mute);color:var(--accent)'
                     : pos <= 6 ? 'background:rgba(255,215,64,0.1);color:var(--yellow)' : '';
      html += `<tr>
        <td><span class="pos-num" style="${posStyle}">${pos}</span></td>
        <td><div class="team-cell">${imgOrPh(team.crest,'team-crest','team-crest-ph')}<span>${team.name??'—'}</span></div></td>
        <td class="num">${fmt(row.playedGames)}</td><td class="num">${fmt(row.won)}</td>
        <td class="num">${fmt(row.draw)}</td><td class="num">${fmt(row.lost)}</td>
        <td class="num">${fmt(row.goalsFor)}</td><td class="num">${fmt(row.goalsAgainst)}</td>
        <td class="num">${fmt(row.goalDifference)}</td>
        <td class="num"><span class="pts-badge">${fmt(row.points)}</span></td>
        <td>${formDots(row.form)}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  });
  return html;
}

/* ════════════════════════════════════════════════════════════
   MATCHES
   ════════════════════════════════════════════════════════════ */
function renderMatches(matches, code) {
  if (!matches?.length) return noData('No match data yet.');
  const filterBar = `<div class="filter-bar">
    ${['all','live','upcoming','finished','postponed'].map(f =>
      `<button class="filter-btn ${currentFilter===f?'active':''}" onclick="applyFilter('${f}')">${
        {all:'All',live:'🔴 Live',upcoming:'Upcoming',finished:'Finished',postponed:'Postponed'}[f]
      }</button>`).join('')}
  </div>`;

  let filtered = matches;
  if (currentFilter==='live')      filtered = matches.filter(m => ['IN_PLAY','PAUSED'].includes(m.status));
  else if (currentFilter==='upcoming')  filtered = matches.filter(m => ['TIMED','SCHEDULED'].includes(m.status));
  else if (currentFilter==='finished')  filtered = matches.filter(m => m.status==='FINISHED');
  else if (currentFilter==='postponed') filtered = matches.filter(m => m.status==='POSTPONED');

  if (!filtered.length) return filterBar + noData('No matches for this filter.');

  const groups = new Map();
  filtered.forEach(m => {
    const key = m.matchday ? `Matchday ${m.matchday}` : (m.utcDate ? fmtDate(m.utcDate) : 'TBD');
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(m);
  });

  let html = filterBar;
  groups.forEach((gm, label) => {
    html += `<div class="matchday-group"><div class="matchday-label">${label}</div>`;
    gm.forEach(m => {
      const ht = m.homeTeam??{}, at = m.awayTeam??{};
      const ft = (m.score??{}).fullTime??{};
      const live = ['IN_PLAY','PAUSED'].includes(m.status);
      const hasScore = ft.home!==null && ft.home!==undefined;
      html += `<div class="match-card${live?' live':''}">
        <div class="match-team">${imgOrPh(ht.crest,'team-crest','team-crest-ph')}<span class="name">${ht.name??'—'}</span></div>
        <div class="match-score-block">
          ${hasScore ? `<div class="match-score">${ft.home} – ${ft.away}</div>`
                     : `<div class="match-score pending">${fmtTime(m.utcDate)||'TBD'}</div>`}
          <div class="match-time">${fmtDate(m.utcDate)}
            <span class="status-pill ${statusClass(m.status)}">${statusLabel(m.status)}</span>
            ${m.minute?`<span style="color:var(--live);font-weight:700">${m.minute}'`:''}
          </div>
        </div>
        <div class="match-team away">${imgOrPh(at.crest,'team-crest','team-crest-ph')}<span class="name">${at.name??'—'}</span></div>
      </div>`;
    });
    html += `</div>`;
  });
  return html;
}

window.applyFilter = function(f) { currentFilter = f; renderTab('matches'); };

/* ════════════════════════════════════════════════════════════
   SCORERS
   ════════════════════════════════════════════════════════════ */
function renderScorers(data) {
  const scorers = data.scorers ?? [];
  if (!scorers.length) return noData('No scorer data yet.');
  let html = `<div style="margin-bottom:18px">
    <span style="font-size:11px;color:var(--text-muted)">${data.display_title??''} — Top ${scorers.length} scorers</span>
  </div>`;
  scorers.forEach((s, i) => {
    const p = s.player??{}, t = s.team??{}, rank = i+1;
    html += `<div class="scorer-row">
      <div class="scorer-rank${rank<=3?' top':''}">${rank}</div>
      <div class="scorer-info">
        <div class="scorer-name">${p.name??'—'}</div>
        <div class="scorer-team">${imgOrPh(t.crest,'team-crest','team-crest-ph')}${t.name??'—'}</div>
      </div>
      <div class="scorer-stats">
        <div class="stat-pill"><div class="val">${fmt(s.goals)}</div><div class="lbl">GOALS</div></div>
        <div class="stat-pill"><div class="val">${fmt(s.assists??'—')}</div><div class="lbl">AST</div></div>
        <div class="stat-pill"><div class="val">${fmt(s.penalties??'—')}</div><div class="lbl">PEN</div></div>
        <div class="stat-pill"><div class="val">${fmt(s.playedMatches)}</div><div class="lbl">MP</div></div>
      </div>
    </div>`;
  });
  return html;
}

/* ════════════════════════════════════════════════════════════
   TEAMS
   ════════════════════════════════════════════════════════════ */
function renderTeams(teams) {
  if (!teams?.length) return noData('No team data yet.');
  let html = `<div class="teams-grid">`;
  teams.forEach(t => {
    html += `<div class="team-card">
      ${imgOrPh(t.crest,'team-card-crest','team-card-crest-ph')}
      <div class="team-card-name">${t.name??'—'}</div>
      <div class="team-card-meta">${t.venue??''}${t.venue&&t.founded?' · ':''}${t.founded?'Est. '+t.founded:''}</div>
      <div class="team-card-meta" style="margin-top:6px;color:var(--text-muted)">${t.squad?.length?t.squad.length+' players':''}</div>
    </div>`;
  });
  return html + `</div>`;
}

/* ════════════════════════════════════════════════════════════
   STATS TAB — split layout: match list | detail
   ════════════════════════════════════════════════════════════ */
function renderStatsTab(matches, statsData, links) {
  if (!matches?.length) return noData('No match data yet. Run the pipeline first.');

  const statsMap = statsData || {};
  const finished = matches.filter(m => m.status === 'FINISHED');
  if (!finished.length) return noData('No finished matches yet.');

  // Sort newest first
  const sorted = [...finished].sort((a,b) => (b.utcDate??'').localeCompare(a.utcDate??''));

  let listHtml = '';
  sorted.forEach(m => {
    const mid   = String(m.id);
    const sd    = statsMap[mid];
    const ht    = m.homeTeam??{}, at = m.awayTeam??{};
    const ft    = (m.score??{}).fullTime??{};
    const score = (ft.home!==null&&ft.home!==undefined) ? `${ft.home}–${ft.away}` : '–';

    listHtml += `<div class="stats-match-item${sd?'':' no-stats'}" data-mid="${mid}" title="${sd?'Click to view stats':'Stats not yet scraped'}">
      <div class="smi-teams">
        <span>${ht.shortName??ht.name??'—'}</span>
        <span class="smi-score">${score}</span>
        <span>${at.shortName??at.name??'—'}</span>
      </div>
      <div class="smi-meta">
        <span>${fmtDate(m.utcDate)}</span>
        ${m.matchday?`<span>MD ${m.matchday}</span>`:''}
        <span class="smi-badge ${sd?'has':'none'}">${sd?'STATS':'NO DATA'}</span>
      </div>
    </div>`;
  });

  return `<div class="stats-layout" style="height:calc(100vh - 160px)">
    <div class="stats-match-list">${listHtml}</div>
    <div class="stats-detail" id="stats-detail-panel">
      <div class="stats-placeholder">
        <div class="icon">⚽</div>
        <div>Select a match to view detailed stats</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px">
          ${Object.keys(statsMap).length} of ${finished.length} finished matches have scraped stats
        </div>
      </div>
    </div>
  </div>`;
}

/* ════════════════════════════════════════════════════════════
   STATS DETAIL — the main viz
   ════════════════════════════════════════════════════════════ */
function renderStatsDetail(match, sd) {
  const ht   = match.homeTeam??{}, at = match.awayTeam??{};
  const ft   = (match.score??{}).fullTime??{};
  const ht_s = (match.score??{}).halfTime??{};
  const stats = sd.stats ?? {};
  const events  = sd.events  ?? [];
  const lineups = sd.lineups ?? {};

  /* ── Match header ── */
  let html = `<div class="sd-header">
    <div class="sd-teams-row">
      <div class="sd-team">${imgOrPh(ht.crest,'team-crest','team-crest-ph')}<span>${ht.name??sd.home_team??'Home'}</span></div>
      <div class="sd-score-block">
        <div class="sd-score">${sd.score?.home??ft.home??'–'} – ${sd.score?.away??ft.away??'–'}</div>
        <div class="sd-ht">HT: ${sd.score?.ht_home??ht_s.home??'–'} – ${sd.score?.ht_away??ht_s.away??'–'}</div>
      </div>
      <div class="sd-team away"><span>${at.name??sd.away_team??'Away'}</span>${imgOrPh(at.crest,'team-crest','team-crest-ph')}</div>
    </div>
    <div class="sd-meta-row">
      <span>${fmtDate(match.utcDate)}</span>
      ${match.matchday?`<span>Matchday ${match.matchday}</span>`:''}
      ${match.venue?`<span>${match.venue}</span>`:''}
      <span style="color:var(--accent)">${sd.status??'Full Time'}</span>
    </div>
  </div>`;

  /* ── Possession pitch-split ── */
  const poss = stats.possession ?? stats.ball_possession ?? null;
  if (poss) {
    const rawHome = poss.home ?? poss.home_team ?? '50%';
    const rawAway = poss.away ?? poss.away_team ?? '50%';
    const homeNum = parseFloat(String(rawHome).replace('%','')) || 50;
    const awayNum = 100 - homeNum;
    html += `<div class="pitch-split-wrap">
      <div class="pitch-split-label">
        <span class="pct home">${homeNum}%</span>
        <span style="font-size:10px;letter-spacing:.12em;color:var(--text-muted)">POSSESSION</span>
        <span class="pct away">${awayNum}%</span>
      </div>
      <div class="pitch-bar">
        <div class="pitch-bar-home" style="width:${homeNum}%">${homeNum > 20 ? homeNum+'%' : ''}</div>
        <div class="pitch-bar-away">${awayNum > 20 ? awayNum+'%' : ''}</div>
      </div>
    </div>`;
  }

  /* ── Stat bars ── */
  const statDefs = [
    { key: ['shots','total_shots'],              label: 'Shots' },
    { key: ['shots_on_target','shots_on_goal'],  label: 'On Target' },
    { key: ['corners','corner_kicks'],           label: 'Corners' },
    { key: ['fouls'],                            label: 'Fouls' },
    { key: ['yellow_cards'],                     label: 'Yellows' },
    { key: ['red_cards'],                        label: 'Reds' },
    { key: ['offsides'],                         label: 'Offsides' },
    { key: ['saves','goalkeeper_saves'],         label: 'Saves' },
  ];

  const statRows = statDefs.map(def => {
    let raw = null;
    for (const k of def.key) { if (stats[k]) { raw = stats[k]; break; } }
    if (!raw) return null;
    const hv = parseInt(raw.home) || 0;
    const av = parseInt(raw.away) || 0;
    const total = hv + av;
    if (total === 0) return null;
    const hPct = total > 0 ? Math.round(hv / total * 100) : 50;
    return { label: def.label, hv, av, hPct };
  }).filter(Boolean);

  if (statRows.length) {
    html += `<div class="stat-bars-section">
      <div class="stat-bars-title">Match Statistics</div>`;
    statRows.forEach(r => {
      html += `<div class="stat-row-full">
        <div class="stat-row-nums">
          <span class="home-val">${r.hv}</span>
          <span class="name-lbl">${r.label}</span>
          <span class="away-val">${r.av}</span>
        </div>
        <div class="dual-bar">
          <div class="dual-bar-home" style="width:${r.hPct}%"></div>
          <div class="dual-bar-away" style="width:${100-r.hPct}%"></div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  /* ── Events timeline ── */
  const goals = events.filter(e => ['goal','penalty'].includes(e.type));
  const cards = events.filter(e => ['yellow_card','red_card'].includes(e.type));
  const allEvents = [...goals, ...cards].sort((a,b) => (a.minute||0)-(b.minute||0));

  if (allEvents.length) {
    const iconMap = { goal:'⚽', penalty:'⚽(P)', yellow_card:'🟨', red_card:'🟥', substitution:'🔄' };
    html += `<div class="events-section">
      <div class="events-title">Key Events</div>
      <div class="events-list">`;
    allEvents.forEach(e => {
      const isHome = e.team === 'home';
      html += `<div class="event-item">
        <div class="event-home">${isHome ? `<span class="event-player">${e.player??''}</span> ${iconMap[e.type]??''}` : ''}</div>
        <div class="event-minute ${e.type}">${e.minute??'?'}'</div>
        <div class="event-away">${!isHome ? `${iconMap[e.type]??''} <span class="event-player">${e.player??''}</span>` : ''}</div>
      </div>`;
    });
    html += `</div></div>`;
  }

  /* ── Lineups ── */
  const homeLU = lineups.home ?? {};
  const awayLU = lineups.away ?? {};
  const hasLineups = (homeLU.starting?.length || awayLU.starting?.length);
  if (hasLineups) {
    html += `<div class="lineups-section">
      <div class="lineups-title">Lineups</div>
      <div class="lineups-grid">`;

    ['home','away'].forEach(side => {
      const lu = lineups[side] ?? {};
      const teamName = side === 'home' ? (ht.shortName??ht.name??sd.home_team??'Home')
                                       : (at.shortName??at.name??sd.away_team??'Away');
      html += `<div>
        <div class="lineup-side-title">
          ${teamName}
          ${lu.formation ? `<span class="lineup-formation">${lu.formation}</span>` : ''}
        </div>`;

      (lu.starting??[]).forEach(p => {
        html += `<div class="lineup-player">
          <div class="lineup-num">${p.number??'–'}</div>
          <span>${p.name??'—'}</span>
        </div>`;
      });

      if (lu.subs?.length) {
        html += `<div class="lineup-subs-label">Substitutes</div>`;
        lu.subs.forEach(p => {
          html += `<div class="lineup-player" style="opacity:.65">
            <div class="lineup-num">${p.number??'–'}</div>
            <span>${p.name??'—'}</span>
          </div>`;
        });
      }
      html += `</div>`;
    });

    html += `</div></div>`;
  }

  return html;
}

/* ════════════════════════════════════════════════════════════
   TICKER
   ════════════════════════════════════════════════════════════ */
function seedTicker() {
  const track = document.getElementById('ticker-track');
  [...track.children].forEach(el => track.appendChild(el.cloneNode(true)));
}
