     goals: [ {minute, type, team, scorer, assist, score} ],

        <div class="stat-tile-sub">avg per game</div>
      </div>
    </div>
  </div>`;

  // Build match sections
  let sectionsHtml = '';
  const renderSection = (title, arr) => {
    if (!arr.length) return '';
    const cards = arr.map(match => matchCardHtml(match)).join('');
    return `
      <div class="match-group-hd">
        <div class="grp-bar"></div>
        <span>${title}</span>
        <span style="color:var(--dim);font-size:9px;margin-left:auto">${arr.length} match${arr.length!==1?'es':''}</span>
      </div>
      <div class="match-grid">${cards}</div>`;
  };

  sectionsHtml += renderSection('🔴 LIVE NOW', live);
  sectionsHtml += renderSection('Upcoming Fixtures', upcoming);
  sectionsHtml += renderSection('Recent Results', finished);

  const matchesWidgetHtml = `
  <div class="widget widget-matches">
    <div class="widget-head">
      <div class="widget-title widget-accent">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Fixtures &amp; Results
      </div>
      <span class="widget-meta">${COMPS.find(c=>c.code===code)?.name||code}</span>
    </div>
    ${sectionsHtml || `<div class="empty-state">No fixture data</div>`}
  </div>`;

  const scorersSidebarHtml = `<div class="widget widget-scorers" id="scorers-sidebar-widget">
    <div class="widget-head">
      <div class="widget-title widget-accent-gold">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Top Scorers
      </div>
      <span class="widget-meta">${COMPS.find(c=>c.code===code)?.short||code}</span>
    </div>
    <div class="scorer-list-head"><span>Player</span><span>Ast &nbsp; Gls</span></div>
    <div id="scorers-sidebar-body"><div class="empty-state" style="padding:24px">Loading…</div></div>
  </div>`;

  dashboard.innerHTML = statBarHtml + matchesWidgetHtml + scorersSidebarHtml;
  loadScorersSidebar(code);
}

/* ─── MATCH CARD HTML ─────────────────────────────────────────────────
   Uses: status, minute, utcDate, homeTeam/awayTeam (shortName, tla, crest,
         leagueRank, formation), score.fullTime, score.halfTime,
         matchday, stage, goals (for scorers list)
────────────────────────────────────────────────────────────────────── */
function matchCardHtml(match) {
  const home   = match.homeTeam || {};
  const away   = match.awayTeam || {};
  const status = match.status || 'UNKNOWN';
  const isLive = status === 'IN_PLAY' || status === 'PAUSED';
  const isDone = status === 'FINISHED';

  const hs  = match.score?.fullTime?.home;
  const as_ = match.score?.fullTime?.away;
  const hasScore = hs != null && as_ != null;

  const homeWon = hasScore && hs > as_;
  const awayWon = hasScore && as_ > hs;

  let dateStr = '–';
  if (match.utcDate) {
    const d = new Date(match.utcDate);
    dateStr = d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' })
            + ' ' + d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', hour12:false });
  }

  let chipHtml;
  if (isLive) {
    const min = match.minute ? `${match.minute}'` : 'LIVE';
    chipHtml = `<span class="chip chip-live">${min}</span>`;
  } else if (isDone) {
    chipHtml = `<span class="chip chip-ft">FT</span>`;
  } else {
    chipHtml = `<span class="chip chip-sched">${status.replace(/_/g,' ')}</span>`;
  }

  const crestImg = (team, sz=18) => team.crest
    ? `<img class="mcard-crest" style="width:${sz}px;height:${sz}px" src="${team.crest}" alt="" loading="lazy" onerror="this.style.display='none'">`
    : '';

  const hScoreCls = `mcard-score${isLive?' live':''}${isDone&&!homeWon?' faded':''}`;
  const aScoreCls = `mcard-score${isLive?' live':''}${isDone&&!awayWon?' faded':''}`;

  // Goals summary (from goals array)
  const goals = match.goals || [];
  let goalsSummary = '';
  if (isDone && goals.length > 0) {
    const homeGoals = goals.filter(g => g.team?.name === home.name || g.team?.id === home.id);
    const awayGoals = goals.filter(g => g.team?.name === away.name || g.team?.id === away.id);
    const goalLine = (gs) => gs.map(g => {
      const name = (g.scorer?.name||'').split(' ').pop();
      const min = g.minute ? `${g.minute}'` : '';
      return `${name} ${min}`;
    }).join(', ');
    if (homeGoals.length) goalsSummary += `<div style="font-family:var(--mono);font-size:8px;color:var(--dim);margin-top:3px;line-height:1.4">${goalLine(homeGoals)}</div>`;
    if (awayGoals.length) goalsSummary += `<div style="font-family:var(--mono);font-size:8px;color:var(--dim);margin-top:1px;line-height:1.4;text-align:right">${goalLine(awayGoals)}</div>`;
  }

  // Formation badges
  const homeFm = home.formation ? `<span class="mcard-formation">${home.formation}</span>` : '';
  const awayFm = away.formation ? `<span class="mcard-formation">${away.formation}</span>` : '';

  // League rank badge
  const rankBadge = (team) => team.leagueRank
    ? `<span style="font-family:var(--mono);font-size:8px;color:var(--dim);margin-left:3px">#${team.leagueRank}</span>`
    : '';

  return `<div class="mcard${isLive?' is-live':''}">
    <div class="mcard-top">
      <span class="mcard-date">${dateStr}</span>
      ${chipHtml}
    </div>
    <div class="mcard-fixture">
      <div class="mcard-team">
        <div class="mcard-team-l">
          ${crestImg(home)}
          <span class="mcard-name${isDone&&!homeWon?' faded':''}">${home.shortName||home.tla||'Home'}</span>
          ${rankBadge(home)}
        </div>
        ${homeFm}
        <span class="${hScoreCls}">${hasScore||isLive?(hs??0):'–'}</span>
      </div>
      <div class="mcard-team">
        <div class="mcard-team-l">
          ${crestImg(away)}
          <span class="mcard-name${isDone&&!awayWon?' faded':''}">${away.shortName||away.tla||'Away'}</span>
          ${rankBadge(away)}
        </div>
        ${awayFm}
        <span class="${aScoreCls}">${hasScore||isLive?(as_??0):'–'}</span>
      </div>
    </div>
    ${goalsSummary}
    <div class="mcard-foot">
      <span>${match.matchday ? 'MD '+match.matchday : (match.stage||'').replace(/_/g,' ')}</span>
      ${match.venue ? `<span style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${match.venue}</span>` : ''}
    </div>
  </div>`;
}

/* ─── SCORERS DASHBOARD ───────────────────────────────────────────────
   JSON from fetch_competitions.py:
   { data: { competition_code, season, count, scorers: [
     { player:{id,name,firstName,lastName,dateOfBirth,nationality,position,shirtNumber},
       team:{id,name,shortName,tla,crest},
       playedMatches, goals, assists, penalties }
   ] } }
────────────────────────────────────────────────────────────────────── */
function renderScorersDash(payload, code) {
  // payload could be the whole {competition_code, scorers, ...} object
  const scorers = (payload.scorers || (Array.isArray(payload) ? payload : []));
  if (!scorers.length) {
    dashboard.innerHTML = `<div class="widget widget-standings"><div class="empty-state">No scorer data<small>./data/${currentSeason}/scorers/${code}.json</small></div></div>`;
    return;
  }

  // Stat bar from scorers data
  const topGoals   = scorers[0]?.goals ?? 0;
  const topScorer  = scorers[0]?.player?.name || '–';
  const totalGoals = scorers.reduce((s,sc) => s + (sc.goals||0), 0);
  const totalAst   = scorers.reduce((s,sc) => s + (sc.assists||0), 0);
  const totalPen   = scorers.reduce((s,sc) => s + (sc.penalties||0), 0);

  const statBarHtml = `
  <div class="widget widget-statbar">
    <div class="widget-head">
      <div class="widget-title widget-accent-gold">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Golden Boot Stats · ${COMPS.find(c=>c.code===code)?.name||code}
      </div>
      <span class="widget-meta">${currentSeason}</span>
    </div>
    <div class="statbar-grid">
      <div class="stat-tile">
        <div class="stat-tile-label">Top Scorer</div>
        <div class="stat-tile-value gold" style="font-size:16px">${topScorer.split(' ').pop()}</div>
        <div class="stat-tile-sub">${topGoals} goals</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">Total Goals</div>
        <div class="stat-tile-value mint">${totalGoals}</div>
        <div class="stat-tile-sub">by top ${scorers.length} players</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">Total Assists</div>
        <div class="stat-tile-value ice">${totalAst}</div>
        <div class="stat-tile-sub">by top ${scorers.length}</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">Penalties</div>
        <div class="stat-tile-value pink">${totalPen}</div>
        <div class="stat-tile-sub">scored</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">Players Tracked</div>
        <div class="stat-tile-value">${scorers.length}</div>
        <div class="stat-tile-sub">in ranking</div>
      </div>
    </div>
  </div>`;

  // Full scorers table (wider — occupies col 1-2)
  let rowsHtml = '';
  scorers.forEach((s, i) => {
    const player  = s.player || {};
    const team    = s.team   || {};
    const goals   = s.goals  ?? 0;
    const assists = s.assists ?? 0;
    const pens    = s.penalties ?? 0;
    const played  = s.playedMatches ?? 0;
    const gpg     = played > 0 ? (goals / played).toFixed(2) : '–';
    const rankCls = i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-n';

    const crestHtml = team.crest
      ? `<img style="width:16px;height:16px;object-fit:contain;flex-shrink:0;margin-right:6px" src="${team.crest}" alt="" loading="lazy" onerror="this.style.display='none'">`
      : '';

    rowsHtml += `<tr>
      <td style="text-align:center"><div class="rank-chip ${rankCls}" style="margin:0 auto">${i+1}</div></td>
      <td style="text-align:left">
        <div style="font-size:12px;font-weight:500;color:var(--text)">${player.name||'–'}</div>
        <div style="font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:1px">${player.position||''} ${player.nationality?'· '+player.nationality:''}</div>
      </td>
      <td style="text-align:left">
        <div style="display:flex;align-items:center">${crestHtml}<span style="font-size:11px;color:var(--sub)">${team.shortName||team.tla||'–'}</span></div>
      </td>
      <td style="font-weight:500;color:var(--mint);font-size:15px">${goals}</td>
      <td style="color:var(--sub)">${assists}</td>
      <td style="color:var(--dim)">${pens}</td>
      <td style="color:var(--dim)">${played}</td>
      <td style="color:var(--sub)">${gpg}</td>
    </tr>`;
  });

  const scorersWidgetHtml = `
  <div class="widget widget-standings">
    <div class="widget-head">
      <div class="widget-title widget-accent-gold">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Top Scorers
      </div>
      <span class="widget-meta">${COMPS.find(c=>c.code===code)?.name||code} · ${currentSeason}</span>
    </div>
    <div style="overflow-x:auto">
      <table class="tbl">
        <thead class="tbl-h">
          <tr>
            <th style="width:40px">#</th>
            <th style="text-align:left">Player</th>
            <th style="text-align:left">Club</th>
            <th class="col-pts" title="Goals">G</th>
            <th title="Assists">A</th>
            <th title="Penalties">Pen</th>
            <th title="Matches Played">MP</th>
            <th title="Goals per game">G/M</th>
          </tr>
        </thead>
        <tbody class="tbl-body">${rowsHtml}</tbody>
      </table>
    </div>
  </div>`;

  dashboard.innerHTML = statBarHtml + scorersWidgetHtml;
}

/* ─── ERROR HTML ─────────────────────────────────────────────────────── */
function errHtml(path, msg) {
  return `<div style="padding:48px 0">
    <div class="error-state">
      <div class="err-icon">✕</div>
      <div class="err-title">Data Not Found</div>
      <div class="err-path">
        <span class="lbl">Path:</span> ${path}<br>
        <span class="lbl">Error:</span> ${msg}
      </div>
      <p class="err-hint">
        Run <code>python workers/fetch_competitions.py</code> or push to GitHub to trigger Actions.
        Click <strong>Docs</strong> above for full setup instructions.
      </p>
    </div>
  </div>`;
}

document.querySelectorAll('.ttab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.ttab').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    currentTab = btn.dataset.tab;
    load();
  });
});

seasonSel.addEventListener('change', () => {
  currentSeason = seasonSel.value;
  buildLiveBar();
  load();
});

/* ─── INIT ───────────────────────────────────────────────────────────── */
initSeasons();
buildCompNav();
buildLiveBar();
load();

})();
</script>
